<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danny Tsai</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    oklch(97% 0.008 240);
      --ink:   oklch(18% 0.012 240);
      --sub:   oklch(52% 0.012 240);
      --line:  oklch(88% 0.010 240);
      --accent: oklch(52% 0.14 250);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ── layout ── */
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── animated SVG mark ── */
    .mark {
      width: 56px;
      height: 56px;
      margin-bottom: 2.8rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .mark-ring {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: draw 0.9s 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    /* ── name ── */
    .name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.6rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.7s 0.25s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .name em {
      font-style: italic;
      color: var(--accent);
    }

    /* ── role ── */
    .role {
      margin-top: 1rem;
      font-size: 0.95rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--sub);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.7s 0.40s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* ── divider ── */
    .divider {
      margin: 2.6rem 0;
      height: 1px;
      background: var(--line);
      width: 0;
      animation: expand 0.8s 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes expand {
      to { width: 100%; }
    }

    /* ── bio grid ── */
    .bio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem 3rem;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.7s 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .bio-item label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 0.4rem;
    }

    .bio-item p {
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
    }

    /* ── contact link ── */
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2.6rem;
      font-size: 0.92rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 400;
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.7s 0.78s cubic-bezier(0.22,1,0.36,1) forwards;
      transition: opacity 0.2s;
    }

    .contact-link:hover { opacity: 0.68; }

    .contact-link svg {
      flex-shrink: 0;
    }

    /* ── project links strip ── */
    .project-links {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-top: 1.6rem;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.7s 0.86s cubic-bezier(0.22,1,0.36,1) forwards;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .project-links::-webkit-scrollbar {
      height: 3px;
    }

    .project-links::-webkit-scrollbar-track {
      background: transparent;
    }

    .project-links::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 2px;
    }

    .project-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.45rem 1rem;
      background: oklch(18% 0.012 240);
      color: oklch(88% 0.010 240);
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: background 0.18s;
    }

    .project-btn:hover {
      background: oklch(30% 0.012 240);
    }

    /* ── footer ── */
    footer {
      margin-top: 4rem;
      font-size: 0.72rem;
      color: var(--line);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: rise 0.7s 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* ── floating dots (background) ── */
    .dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.06;
      animation: float linear infinite;
    }

    @keyframes float {
      from { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-22px) scale(1.08); }
      to   { transform: translateY(0) scale(1); }
    }

    .card { position: relative; z-index: 1; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
